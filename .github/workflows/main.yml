name: Telegram Notify

on:
  push:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get diff stats
        id: diff
        run: |
          FILES_CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')
          LINES_ADDED=$(git diff-tree --no-commit-id --numstat -r HEAD | awk '{a+=$1} END {if(a=="") print 0; else print a}')
          LINES_REMOVED=$(git diff-tree --no-commit-id --numstat -r HEAD | awk '{a+=$2} END {if(a=="") print 0; else print a}')

          echo "files=$FILES_CHANGED" >> $GITHUB_OUTPUT
          echo "added=$LINES_ADDED" >> $GITHUB_OUTPUT
          echo "removed=$LINES_REMOVED" >> $GITHUB_OUTPUT

          
      - name: Short SHA
        id: shortsha
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          
      - name: send telegram message on push
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TGBOT_API_KEY }}
          format: html
          message: |
            <b>Commit <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ steps.shortsha.outputs.sha_short }}</a></b>

            — <b>${{ github.actor }}</b> committed to branch <code>${{ github.ref_name }}</code>

            <blockquote>${{ github.event.commits[0].message }}</blockquote>

            <b>${{ steps.diff.outputs.files }} files changed</b> || <b>+${{ steps.diff.outputs.added }}</b> <b>-${{ steps.diff.outputs.removed }}</b>
